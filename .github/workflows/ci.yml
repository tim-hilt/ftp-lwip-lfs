name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (ftp_server compiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build ftp_server
        run: cmake --build build --target ftp_server -j

  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFTP_SERVER_BUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build -j

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

  test-badge:
    name: test badge
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFTP_SERVER_BUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build -j

      - name: Run tests and capture JUnit results
        working-directory: build
        run: ctest --output-junit test-results.xml --output-on-failure

      - name: Generate test badge
        id: tests
        run: |
          mkdir -p .github/badges
          python3 .github/scripts/gen_test_badge.py build/test-results.xml .github/badges/tests.json

      - name: Commit test badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/tests.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update test badge [skip ci]"
            # The coverage job may push concurrently; rebase and retry.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi

  clang-tidy:
    name: static analysis (clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build clang-tidy image
        run: docker build -t ftp-lwip-lfs-clang-tidy .

      - name: Run clang-tidy (ftp_server.c/.h only)
        run: docker run --rm -v "${{ github.workspace }}":/repo ftp-lwip-lfs-clang-tidy

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr

      - name: Configure (coverage instrumentation)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFTP_SERVER_BUILD_TESTS=ON -DFTP_SERVER_ENABLE_COVERAGE=ON

      # All test executables, including the separately configured credential
      # builds — their .gcda files are merged by gcovr below.
      - name: Build tests
        run: cmake --build build -j

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Compute coverage percentage
        id: cov
        run: |
          gcovr --root . --filter '.*ftp_server\.c$' --merge-mode-functions=merge-use-line-min \
                --json-summary-pretty --json-summary coverage-summary.json build/
          pct=$(jq '.line_percent' coverage-summary.json)
          echo "pct=$pct" >> "$GITHUB_OUTPUT"

      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          pct="${{ steps.cov.outputs.pct }}"
          color=red
          awk "BEGIN { exit !($pct >= 80) }" && color=brightgreen
          awk "BEGIN { exit !($pct >= 50 && $pct < 80) }" && color=yellow
          mkdir -p .github/badges
          cat > .github/badges/coverage.json <<EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${pct}%",
            "color": "${color}"
          }
          EOF

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update coverage badge [skip ci]"
            # The test-badge job may push concurrently; rebase and retry.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi
